services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    ports:
      - '27017:27017'

  api:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      NODE_ENV: production
      PORT: '4000'
      MONGODB_URI: mongodb://mongo:27017/aurora_erp
      MONGODB_DB: aurora_erp
      JWT_ACCESS_SECRET: change-me-access-secret-at-least-32-characters-long
      JWT_REFRESH_SECRET: change-me-refresh-secret-at-least-32-characters-long
      CLIENT_URL: http://localhost:3000
      CORS_ORIGINS: http://localhost:3000
      LICENSE_ENFORCEMENT: 'false'
    ports:
      - '4000:4000'

  web:
    build:
      context: ./client
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_NAME: Aurora ERP
    ports:
      - '3000:3000'

volumes:
  mongo_data: